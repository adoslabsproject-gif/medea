name: Release installers

# Costruisce .dmg (macOS) e .exe (Windows NSIS) sui runner GitHub: il .exe
# non è producibile da macOS, quindi la CI è l'unico modo per averlo.
#
# Due modi di lanciarlo, con esiti diversi di proposito:
#
#   • tag `v*`  → RILASCIO. Il nome e il numero vengono dal tag, la release
#                 nasce pubblica, e le note sono quelle di `docs/note-release.md`.
#   • a mano    → PROVA. Numero `v<versione>-dev-<N>`, release in bozza: serve
#                 a vedere se compila, non a farla scaricare a qualcuno.
#
# Il numero di versione vero sta in `apps/desktop/src-tauri/tauri.conf.json` ed
# è lo stesso in altri tre file — `src/app/versione.test.ts` lo verifica.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm tokens:build

      # Il motore dei workflow. Senza questo passo l'installatore esce con la
      # cartella `resources/runtime` vuota — e' successo fino alla 0.2.0: chi
      # scaricava trovava un editor che disegna workflow e non ne esegue
      # nessuno. Prima i pacchetti, poi il bundle, poi la copia che viaggia
      # con l'app (dipendenze di produzione + il Node del runner).
      - name: Costruisci i pacchetti del motore
        run: pnpm -r --filter "./packages/engine/**" --filter "./packages/engine-shared" build

      - name: Costruisci il motore
        run: pnpm --filter @medea/engine-runtime build

      - name: Impacchetta il motore dentro l'app
        run: node scripts/package-runtime.mjs

      # La versione dichiarata dall'app, letta dove la legge Tauri: cosi' il
      # nome della release non puo' discostarsi da quello degli installatori.
      - name: Leggi la versione
        id: versione
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "numero=$v" >> "$GITHUB_OUTPUT"

      - name: Note di rilascio
        id: note
        shell: bash
        run: |
          {
            echo 'testo<<FINE'
            cat docs/note-release.md
            echo FINE
          } >> "$GITHUB_OUTPUT"

      - name: Build app + installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev-{1}', steps.versione.outputs.numero, github.run_number) }}
          releaseName: ${{ github.ref_type == 'tag' && format('Medea {0}', steps.versione.outputs.numero) || format('Medea {0} — prova {1}', steps.versione.outputs.numero, github.run_number) }}
          releaseBody: ${{ steps.note.outputs.testo }}
          # Da un tag la release nasce pubblica: e' quello il gesto con cui si
          # decide di pubblicare. A mano resta in bozza.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
