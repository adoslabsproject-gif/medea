[package]
name = "medea-desktop"
version = "0.0.0"
description = "Medea — personal operational memory system (desktop shell)"
authors = ["Medea contributors"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[lib]
name = "medea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
